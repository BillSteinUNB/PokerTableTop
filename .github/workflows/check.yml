name: Check game
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: poker_test
          POSTGRES_PASSWORD: poker_test
          POSTGRES_DB: poker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://poker_test:poker_test@127.0.0.1:5432/poker_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: docker build -t pixel-poker:check .
